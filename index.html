<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF1F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>今日のプラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EFF1F2;--surface:#FBFBFA;--surface2:#E9EBEC;--border:#DCDFE2;--border2:#E1E4E6;
  --text:#2B3138;--muted:#646B72;--strong:#46627F;--tint:#E3E9EF;
  --t-morning-bg:#EFEAE2;--t-morning-fg:#6E5C45;
  --t-after-bg:var(--tint);--t-after-fg:var(--strong);
  --t-night-bg:#E8E6EA;--t-night-fg:#5E5868;
  --check-border:#A9B0B6;--accent:#557392;--on-accent:#FFFFFF;--danger:#9A4B45;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* テーマカラー：アクセント・強調色・淡い色・背景まで切り替える */
:root[data-accent="blue"]{--accent:#557392;--strong:#46627F;--tint:#E3E9EF;--bg:#EEF1F4}
:root[data-accent="sage"]{--accent:#5A7872;--strong:#4A6660;--tint:#E0EAE6;--bg:#EDF2EF}
:root[data-accent="violet"]{--accent:#7A6F8E;--strong:#64587A;--tint:#E9E4F0;--bg:#F1EFF4}
:root[data-accent="slate"]{--accent:#4F5A65;--strong:#3F4952;--tint:#E2E5E9;--bg:#EEEFF0}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16191C;--surface:#1F2327;--surface2:#1A1D20;--border:#2E3439;--border2:#272C30;
    --text:#E6E8EA;--muted:#A0A7AE;--strong:#A9BFD6;--tint:#26313B;
    --t-morning-bg:#2E2a24;--t-morning-fg:#D2C2A8;
    --t-after-bg:#26313B;--t-after-fg:#A9BFD6;
    --t-night-bg:#2B2830;--t-night-fg:#C3BACF;
    --check-border:#5C646B;--danger:#E0A39D;
  }
}
:root[data-theme="dark"]{
  --bg:#16191C;--surface:#1F2327;--surface2:#1A1D20;--border:#2E3439;--border2:#272C30;
  --text:#E6E8EA;--muted:#A0A7AE;--strong:#A9BFD6;--tint:#26313B;
  --t-morning-bg:#2E2a24;--t-morning-fg:#D2C2A8;
  --t-after-bg:#26313B;--t-after-fg:#A9BFD6;
  --t-night-bg:#2B2830;--t-night-fg:#C3BACF;
  --check-border:#5C646B;--danger:#E0A39D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%}
.app{max-width:520px;margin:0 auto;padding:20px 20px 120px}
.hidden{display:none!important}

/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 4px 14px}
.hd-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.date{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.04em}
h1{margin:0;font-size:22px;font-weight:700;line-height:1.35;letter-spacing:.02em}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--strong)}
.pill{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 12px}
.pill small{font-size:11px;font-weight:500;color:var(--muted)}
.pill b{font-size:20px;font-weight:700;color:var(--strong);font-variant-numeric:tabular-nums}
.pill b span{font-size:12px;font-weight:500}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px}
.prog{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prog-top span{font-size:15px;font-weight:700}
.prog-top b{font-size:32px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.prog-top b small{font-size:16px}
.bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}
.prog-bot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:500;color:var(--muted)}

.group{margin:0 0 16px}
.group h2{margin:0 4px 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.list{display:flex;flex-direction:column;gap:8px}
.task{width:100%;min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-align:left;
  background:var(--surface);border:1px solid var(--border);transition:background .15s}
.task.done{background:var(--surface2);border-color:var(--border2)}
.ic{width:42px;height:42px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ic.morning{background:var(--t-morning-bg);color:var(--t-morning-fg)}
.ic.after{background:var(--t-after-bg);color:var(--t-after-fg)}
.ic.night{background:var(--t-night-bg);color:var(--t-night-fg)}
.task.done .ic{opacity:.6}
.tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tx b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.task.done .tx b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tx small{font-size:12px;font-weight:500;color:var(--muted)}
.pts{font-size:14px;font-weight:700;color:var(--strong);white-space:nowrap}
.chk{width:32px;height:32px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1.5px solid var(--check-border);transition:transform .15s}
.task.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.task:active .chk{transform:scale(.9)}

.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;line-height:1.7}
.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;font-weight:500;color:var(--strong)}

/* rewards */
.bal{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.bal-l{display:flex;flex-direction:column;gap:2px}
.bal-l small,.bal-r small{font-size:13px;font-weight:500;color:var(--muted)}
.bal-l b{font-size:32px;font-weight:700;line-height:1.1;color:var(--strong);font-variant-numeric:tabular-nums}
.bal-l b span{font-size:16px;font-weight:500}
.bal-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.bal-r b{font-size:15px;font-weight:700;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rw{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.rw .ic{width:52px;height:52px;border-radius:14px;background:var(--tint);color:var(--strong)}
.rw b{font-size:15px;font-weight:700;line-height:1.4;min-height:42px;display:flex;align-items:center;overflow-wrap:anywhere}
.rw .cost{font-size:14px;font-weight:700;color:var(--strong)}
.btn{width:100%;min-height:44px;border-radius:10px;font-size:14px;font-weight:700;border:none;background:var(--accent);color:var(--on-accent)}
.btn:disabled{background:var(--bg);color:var(--muted);border:1px dashed var(--check-border);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--surface);color:var(--danger);border:1px solid var(--border)}

/* records */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
.dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--muted)}
.dot.part{background:var(--tint);color:var(--strong);border-color:var(--tint)}
.dot.full{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot.today{outline:2px solid var(--strong);outline-offset:2px}
.cal-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-hd b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center}
.cal-nav:disabled{opacity:.35;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .wd.sun{color:var(--danger)}
.cal .wd.sat{color:var(--strong)}
.cd{aspect-ratio:1/1;width:100%;padding:0;border:none;background:transparent;color:var(--text);font-family:inherit;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
button.cd:hover{background:var(--surface2)}
.dd{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.dd-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.dd-hd b{font-size:16px;font-weight:700}
.dd-hd span{font-size:14px;font-weight:700;color:var(--strong);white-space:nowrap}
.dd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dd li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2);font-size:15px;font-weight:500}
.dd li:last-child{border-bottom:none}
.dd li .mk{width:24px;height:24px;flex-shrink:0;border-radius:7px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.dd li .mk.gift{background:var(--tint);color:var(--strong)}
.dd li em{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
.dd .sub{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.dd .none{font-size:14px;color:var(--muted);margin:0;line-height:1.7}
.cd.part{background:var(--tint);color:var(--strong);font-weight:700}
.cd.full{background:var(--accent);color:var(--on-accent);font-weight:700}
.cd.today{box-shadow:inset 0 0 0 2px var(--strong)}
.cd.full.today{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 4px var(--surface)}
.cd.future{color:var(--muted);opacity:.5}
.cd.sel{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;font-weight:500;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.stat small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
.stat b{font-size:26px;font-weight:700;color:var(--strong);font-variant-numeric:tabular-nums}
.stat b span{font-size:14px;font-weight:500}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border2);font-size:14px}
.hist li:last-child{border-bottom:none}
.hist li span{color:var(--muted);font-size:13px;white-space:nowrap}
.sec-t{margin:22px 4px 8px;font-size:15px;font-weight:700}

/* settings */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:16px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 3px var(--surface)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border2)}
.row:last-of-type{border-bottom:none}
.row-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.row-f.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.mini{display:flex;flex-direction:column;gap:4px}
.mini span{font-size:11px;font-weight:700;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--danger);display:flex;align-items:center;justify-content:center}
.add{margin-top:10px}
.adj{display:flex;align-items:center;gap:10px}
.adj b{flex:1;text-align:center;font-size:24px;font-weight:700;color:var(--strong);font-variant-numeric:tabular-nums}
.adj .btn{width:72px}
.help{font-size:12px;color:var(--muted);line-height:1.7;margin:6px 0 0}
.lock{max-width:320px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.lock .inp{text-align:center;letter-spacing:.4em;font-size:22px}
.err{color:var(--danger);font-size:13px;font-weight:700;min-height:18px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.nav button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;
  color:var(--muted);font-size:12px;font-weight:700;border-radius:14px}
.nav button[aria-current="page"]{background:var(--tint);color:var(--accent)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(20,24,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px}
@media (min-width:560px){.scrim{align-items:center}}
.modal{width:100%;max-width:420px;background:var(--surface);border-radius:20px;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:18px;font-weight:700}
.modal p{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
.modal .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:40;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="view" aria-live="polite"></main>

<nav class="nav" aria-label="メニュー">
  <div class="nav-in">
    <button type="button" data-tab="today">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>今日</button>
    <button type="button" data-tab="rewards">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7c-1-3-5-4-5-1.5S10 7 12 7c2 0 5-.5 5-2.5S13 4 12 7z"/></svg>ごほうび</button>
    <button type="button" data-tab="records">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v15H4zM4 9h16M8 3v4M16 3v4"/></svg>記録</button>
    <button type="button" data-tab="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>設定</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var KEY = 'kids-task-app-v1';
  var ACCENTS = [
    {c:'#557392', n:'スモーキーブルー'},
    {c:'#5A7872', n:'セージグリーン'},
    {c:'#7A6F8E', n:'ダスティバイオレット'},
    {c:'#4F5A65', n:'スレート'}
  ];
  var WHENS = [
    {k:'朝', cls:'morning'},
    {k:'放課後', cls:'after'},
    {k:'夜', cls:'night'}
  ];
  var BONUS = 20;
  var WD = ['日','月','火','水','木','金','土'];

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function defaults(){
    return {
      v:1, name:'', accent:'#557392', weeklyGoal:300, points:0, pin:'',
      tasks:[
        {id:uid(), title:'宿題', when:'放課後', mins:30, pts:30},
        {id:uid(), title:'漢字の練習', when:'放課後', mins:15, pts:15},
        {id:uid(), title:'読書', when:'放課後', mins:30, pts:20},
        {id:uid(), title:'洗濯物をたたむ', when:'夜', mins:10, pts:15},
        {id:uid(), title:'明日の持ち物の準備', when:'夜', mins:10, pts:10}
      ],
      rewards:[
        {id:uid(), title:'ゲーム時間 +30分', cost:150},
        {id:uid(), title:'週末のおやつを選べる', cost:100},
        {id:uid(), title:'夕飯のメニューを決める', cost:200},
        {id:uid(), title:'友だちと出かける日', cost:400}
      ],
      days:{}, history:[]
    };
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw);
        if(s && Array.isArray(s.tasks) && Array.isArray(s.rewards)){
          var d = defaults();
          for(var k in d){ if(!(k in s)) s[k] = d[k]; }
          return s;
        }
      }
    }catch(e){}
    return defaults();
  }
  var S = load();
  var storageOk = true;
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
    catch(e){ storageOk = false; }
  }

  var tab = 'today';
  var unlocked = false;
  var calOffset = 0;
  var selDay = '';
  var editing = false; // false | true | 'pin'
  var renderedDay = '';

  function pad(n){ return (n<10?'0':'')+n; }
  function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }
  function fromKey(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function num(v, def, min, max){ var n=parseInt(v,10); if(isNaN(n)) n=def; if(min!=null) n=Math.max(min,n); if(max!=null) n=Math.min(max,n); return n; }

  function day(k){
    if(!S.days[k]) S.days[k] = {done:[], bonus:false, earned:0, complete:false};
    return S.days[k];
  }
  function peekDay(k){ return S.days[k] || null; }
  function doneCount(k){
    var d = peekDay(k); if(!d) return 0;
    return S.tasks.filter(function(t){ return d.done.indexOf(t.id) > -1; }).length;
  }
  function streak(){
    var t = new Date(); var n = 0;
    var d0 = peekDay(keyOf(t));
    var cur = (d0 && d0.complete) ? t : addDays(t,-1);
    while(true){
      var dd = peekDay(keyOf(cur));
      if(dd && dd.complete){ n++; cur = addDays(cur,-1); } else break;
    }
    return n;
  }
  function weekStart(){
    var t = new Date(); var wd = (t.getDay()+6)%7;
    return addDays(new Date(t.getFullYear(), t.getMonth(), t.getDate()), -wd);
  }
  function weekEarned(){
    var s = weekStart(), sum = 0;
    for(var i=0;i<7;i++){ var d = peekDay(keyOf(addDays(s,i))); if(d) sum += d.earned||0; }
    return sum;
  }

  function applyAccent(){
    var keys = {'#557392':'blue','#5A7872':'sage','#7A6F8E':'violet','#4F5A65':'slate'};
    var key = keys[S.accent] || 'blue';
    document.documentElement.setAttribute('data-accent', key);
    document.documentElement.style.removeProperty('--accent');
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#EFF1F2');
  }

  function svg(name, size, sw){
    return '<svg width="'+(size||24)+'" height="'+(size||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[name]+'</svg>';
  }
  function whenCls(w){ for(var i=0;i<WHENS.length;i++) if(WHENS[i].k===w) return WHENS[i].cls; return 'after'; }

  /* ---------- toast & modal ---------- */
  var toastTimer;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }
  function modal(opts){
    var prev = document.activeElement;
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">'+
      '<h3 id="mt">'+esc(opts.title)+'</h3>'+(opts.body?'<p>'+esc(opts.body)+'</p>':'')+
      '<div class="acts"><button type="button" class="btn ghost" data-m="no">'+esc(opts.cancel||'やめる')+'</button>'+
      '<button type="button" class="btn'+(opts.danger?' danger':'')+'" data-m="yes">'+esc(opts.ok||'OK')+'</button></div></div>';
    function close(){ scrim.remove(); document.removeEventListener('keydown', onKey); if(prev && prev.focus) prev.focus(); }
    function onKey(e){ if(e.key==='Escape') close(); }
    scrim.addEventListener('click', function(e){
      if(e.target===scrim){ close(); return; }
      var b = e.target.closest('[data-m]'); if(!b) return;
      close(); if(b.getAttribute('data-m')==='yes' && opts.onOk) opts.onOk();
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(scrim);
    scrim.querySelector('[data-m="yes"]').focus();
  }

  /* ---------- actions ---------- */
  function toggleTask(id, k){
    var t = S.tasks.filter(function(x){return x.id===id;})[0]; if(!t) return;
    k = k || todayKey();
    var d = day(k);
    var i = d.done.indexOf(id);
    if(i>-1){
      var was = (d.names && d.names[id]) ? d.names[id].pts : t.pts;
      d.done.splice(i,1); S.points = Math.max(0, S.points - was); d.earned -= was;
      if(d.names) delete d.names[id];
    }
    else {
      d.done.push(id); S.points += t.pts; d.earned += t.pts;
      if(!d.names) d.names = {};
      d.names[id] = {title:t.title, pts:t.pts};
    }
    var all = S.tasks.length>0 && S.tasks.every(function(x){ return d.done.indexOf(x.id)>-1; });
    if(all && !d.bonus){ d.bonus = true; S.points += BONUS; d.earned += BONUS; toast('全部完了！ボーナス +'+BONUS+'pt'); }
    else if(!all && d.bonus){ d.bonus = false; S.points = Math.max(0, S.points - BONUS); d.earned -= BONUS; }
    d.complete = all;
    save(); render();
  }
  function redeem(id){
    var r = S.rewards.filter(function(x){return x.id===id;})[0]; if(!r) return;
    if(S.points < r.cost) return;
    modal({
      title:'「'+r.title+'」と交換する？',
      body: r.cost+'pt を使います。交換したら家の人に見せてね。',
      ok:'交換する',
      onOk:function(){
        S.points -= r.cost;
        S.history.unshift({date:todayKey(), title:r.title, cost:r.cost});
        S.history = S.history.slice(0,50);
        save(); render();
        toast('「'+r.title+'」と交換しました');
      }
    });
  }

  /* ---------- views ---------- */
  function header(title){
    var t = new Date();
    return '<header class="hd"><div class="hd-l">'+
      '<span class="date">'+(t.getMonth()+1)+'月'+t.getDate()+'日（'+WD[t.getDay()]+'）</span>'+
      '<h1>'+esc(title)+'</h1>'+
      '</div><div class="pill"><small>ポイント</small><b>'+S.points+'<span> pt</span></b></div></header>';
  }

  function viewToday(){
    var k = todayKey(), d = peekDay(k) || {done:[]};
    var total = S.tasks.length, dc = doneCount(k);
    var pct = total ? Math.round(dc/total*100) : 0;
    var all = total>0 && dc===total;
    var h = header(S.name ? S.name+'の今日のプラン' : '今日のプラン');
    if(!S.name){
      h += '<div class="notice"><span>設定で名前を入れると、ここに表示されます</span></div>';
    }
    h += '<section class="card prog" aria-label="今日の達成率"><div class="prog-top"><span>今日の達成率</span><b>'+pct+'<small>%</small></b></div>'+
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
      '<div class="prog-bot"><span>'+dc+' / '+total+' 完了</span><span>'+(all?'全部完了！ボーナス +'+BONUS+'pt':'全部終えるとボーナス +'+BONUS+'pt')+'</span></div></section>';
    if(!total){
      h += '<div class="card empty">タスクがまだありません。<br>「設定」からやることを追加しましょう。</div>';
      return h;
    }
    WHENS.forEach(function(w){
      var ts = S.tasks.filter(function(t){ return t.when===w.k; });
      if(!ts.length) return;
      h += '<section class="group"><h2>'+w.k+'</h2><div class="list">';
      ts.forEach(function(t){
        var done = d.done.indexOf(t.id)>-1;
        h += '<button type="button" class="task'+(done?' done':'')+'" data-act="toggle" data-id="'+t.id+'" aria-pressed="'+done+'">'+
          '<span class="ic '+w.cls+'">'+svg(w.k,24)+'</span>'+
          '<span class="tx"><b>'+esc(t.title)+'</b><small>目安 '+t.mins+'分</small></span>'+
          '<span class="pts">+'+t.pts+'pt</span>'+
          '<span class="chk">'+(done?svg('check',20,3):'')+'</span></button>';
      });
      h += '</div></section>';
    });
    return h;
  }

  function viewRewards(){
    var we = weekEarned(), goal = S.weeklyGoal||0;
    var left = Math.max(0, goal - we);
    var h = header('ごほうび');
    h += '<section class="card bal"><div class="bal-l"><small>使えるポイント</small><b>'+S.points+'<span> pt</span></b></div>'+
      (goal>0 ? '<div class="bal-r"><small>今週の目標 '+goal+'pt</small><b>'+(left>0?'あと '+left+'pt':'達成！')+'</b></div>' : '')+
      '</section>';
    if(!S.rewards.length){
      h += '<div class="card empty">ごほうびがまだありません。<br>「設定」から追加しましょう。</div>';
      return h;
    }
    h += '<div class="grid">';
    S.rewards.forEach(function(r){
      var ok = S.points >= r.cost;
      h += '<div class="rw"><span class="ic">'+svg('gift',28)+'</span><b>'+esc(r.title)+'</b><span class="cost">'+r.cost+' pt</span>'+
        '<button type="button" class="btn" data-act="redeem" data-id="'+r.id+'"'+(ok?'':' disabled')+'>'+(ok?'交換する':'あと '+(r.cost-S.points)+'pt')+'</button></div>';
    });
    h += '</div>';
    return h;
  }

  function viewRecords(){
    var h = header('記録');
    var now = new Date(), tk = todayKey();
    var y = now.getFullYear(), m = now.getMonth() + calOffset;
    var first = new Date(y, m, 1);
    y = first.getFullYear(); m = first.getMonth();
    var daysIn = new Date(y, m+1, 0).getDate();
    var activeDays = 0, monthPts = 0;
    for(var j=1;j<=daysIn;j++){
      var dd = peekDay(keyOf(new Date(y,m,j)));
      if(dd && dd.done.length){ activeDays++; }
      if(dd) monthPts += dd.earned||0;
    }
    h += '<div class="stats"><div class="card stat"><small>'+(m+1)+'月にタスクをした日</small><b>'+activeDays+'<span> 日</span></b></div>'+
      '<div class="card stat"><small>'+(m+1)+'月にためたポイント</small><b>'+Math.max(0,monthPts)+'<span> pt</span></b></div></div>';

    h += '<section class="card"><div class="cal-hd">'+
      '<button type="button" class="cal-nav" data-act="cal-prev" aria-label="前の月"'+(calOffset<=-24?' disabled':'')+'><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>'+
      '<b>'+y+'年 '+(m+1)+'月</b>'+
      '<button type="button" class="cal-nav" data-act="cal-next" aria-label="次の月"'+(calOffset>=0?' disabled':'')+'><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>'+
      '</div><div class="cal" aria-label="'+y+'年'+(m+1)+'月のカレンダー">';
    WD.forEach(function(w,i){ h += '<div class="wd'+(i===0?' sun':i===6?' sat':'')+'" aria-hidden="true">'+w+'</div>'; });
    for(var b=0;b<first.getDay();b++) h += '<div aria-hidden="true"></div>';
    for(var dnum=1; dnum<=daysIn; dnum++){
      var dt = new Date(y,m,dnum), k = keyOf(dt), d = peekDay(k);
      var future = dt > now && k!==tk;
      var c = d && d.complete ? 'full' : (d && d.done.length ? 'part' : '');
      var state = c==='full' ? '全部できた' : c==='part' ? '少しできた' : (future ? '' : '記録なし');
      var cls = 'cd '+c+(k===tk?' today':'')+(future?' future':'')+(k===selDay?' sel':'');
      var lab = (m+1)+'月'+dnum+'日（'+WD[dt.getDay()]+'） '+state;
      if(future) h += '<div class="'+cls+'" aria-label="'+lab+'">'+dnum+'</div>';
      else h += '<button type="button" class="'+cls+'" data-act="pick-day" data-k="'+k+'" aria-label="'+lab+'" aria-pressed="'+(k===selDay)+'">'+dnum+'</button>';
    }
    h += '</div><div class="legend"><span><i style="background:var(--accent)"></i>全部できた</span>'+
      '<span><i style="background:var(--tint)"></i>少しできた</span></div>';
    h += '<div class="dd" aria-live="polite">';
    if(!selDay){
      h += '<p class="none">日付をタップすると、その日にできたタスクが見られます。</p>';
    } else {
      var sd = fromKey(selDay), sdd = peekDay(selDay);
      var ids = sdd ? sdd.done : [];
      var earned = sdd ? Math.max(0, sdd.earned||0) : 0;
      h += '<div class="dd-hd"><b>'+(sd.getMonth()+1)+'月'+sd.getDate()+'日（'+WD[sd.getDay()]+'）</b>'+(earned?'<span>+'+earned+'pt</span>':'')+'</div>';
      if(editing==='pin'){
        h += '<p class="none">記録をつけるには、家の人の暗証番号を入れてください。</p>'+
          '<input id="pin-in2" class="inp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="暗証番号">'+
          '<div class="err" id="pin-err2"></div>'+
          '<div class="row-f two" style="margin-top:0"><button type="button" class="btn ghost" data-act="edit-done">やめる</button>'+
          '<button type="button" class="btn" data-act="unlock-edit">開く</button></div>';
      } else if(editing){
        h += '<div class="sub">タップして記録をつける・外す</div><div class="list">';
        S.tasks.forEach(function(t){
          var dn = ids.indexOf(t.id)>-1;
          h += '<button type="button" class="task'+(dn?' done':'')+'" data-act="toggle-past" data-id="'+t.id+'" aria-pressed="'+dn+'">'+
            '<span class="ic '+whenCls(t.when)+'">'+svg(t.when,22)+'</span>'+
            '<span class="tx"><b>'+esc(t.title)+'</b><small>'+esc(t.when)+'</small></span>'+
            '<span class="pts">+'+t.pts+'pt</span>'+
            '<span class="chk">'+(dn?svg('check',20,3):'')+'</span></button>';
        });
        ids.forEach(function(id){
          if(S.tasks.some(function(x){return x.id===id;})) return;
          var sv = sdd.names && sdd.names[id];
          h += '<div class="task done" aria-label="削除したタスク"><span class="tx"><b>'+esc(sv?sv.title:'（削除したタスク）')+'</b><small>削除したタスクなので変更できません</small></span></div>';
        });
        if(!S.tasks.length) h += '<p class="none">タスクがありません。「設定」から追加してください。</p>';
        h += '</div><button type="button" class="btn" data-act="edit-done">完了</button>';
      } else if(!ids.length){
        h += '<p class="none">この日のタスクの記録はありません。</p>';
      } else {
        h += '<div class="sub">できたタスク</div><ul>';
        ids.forEach(function(id){
          var cur = S.tasks.filter(function(x){return x.id===id;})[0];
          var saved = sdd.names && sdd.names[id];
          var title = cur ? cur.title : (saved ? saved.title : '（削除したタスク）');
          var pts = saved ? saved.pts : (cur ? cur.pts : null);
          h += '<li><span class="mk">'+svg('check',16,3)+'</span>'+esc(title)+(pts!=null?'<em>+'+pts+'pt</em>':'')+'</li>';
        });
        if(sdd.bonus) h += '<li><span class="mk">'+svg('check',16,3)+'</span>全部完了ボーナス<em>+'+BONUS+'pt</em></li>';
        h += '</ul>';
      }
      var got = S.history.filter(function(x){ return x.date===selDay; });
      if(got.length){
        h += '<div class="sub">交換したごほうび</div><ul>';
        got.forEach(function(x){ h += '<li><span class="mk gift">'+svg('gift',16,2.2)+'</span>'+esc(x.title)+'<em>−'+x.cost+'pt</em></li>'; });
        h += '</ul>';
      }
      if(!editing){
        h += '<button type="button" class="btn ghost" data-act="edit-day">'+(ids.length?'この日の記録を直す':'この日の記録をつける')+'</button>';
      }
    }
    h += '</div></section>';
    h += '<h2 class="sec-t">交換したごほうび</h2>';
    if(!S.history.length){
      h += '<div class="card empty">まだ交換していません。<br>ポイントをためて「ごほうび」で交換しよう。</div>';
    } else {
      h += '<div class="card" style="padding-top:6px;padding-bottom:6px"><ul class="hist">';
      S.history.slice(0,20).forEach(function(x){
        var d = fromKey(x.date);
        h += '<li><b>'+esc(x.title)+'</b><span>'+(d.getMonth()+1)+'/'+d.getDate()+' ・ '+x.cost+'pt</span></li>';
      });
      h += '</ul></div>';
    }
    return h;
  }

      (S.pin?'<button type="button" class="btn danger" data-act="clear-pin">ロックを外す</button>':'')+'</div>'+
      '<p class="help">ロックすると、この設定画面を開くときに暗証番号が必要になります。</p></section>';

    h += '<h2 class="sec-t">データ</h2><section class="card">'+
      '<p class="help" style="margin:0 0 12px">データはこのスマホのブラウザの中にだけ保存されます。ほかの端末とは共有されません。</p>'+
      '<button type="button" class="btn danger" data-act="reset">すべてのデータを消して最初から</button>'+
      (storageOk?'':'<p class="err" style="margin-top:10px">このブラウザでは保存できませんでした。閉じると記録が消える場合があります。</p>')+
      '</section>';
    return h;
  }

  function render(){
    applyAccent();
    renderedDay = todayKey();
    var v = document.getElementById('view');
    var html = tab==='today' ? viewToday() : tab==='rewards' ? viewRewards() : tab==='records' ? viewRecords() : viewSettings();
    v.innerHTML = html;
    var btns = document.querySelectorAll('.nav button');
    for(var i=0;i<btns.length;i++){
      if(btns[i].getAttribute('data-tab')===tab) btns[i].setAttribute('aria-current','page');
      else btns[i].removeAttribute('aria-current');
    }
  }

  /* ---------- events ---------- */
  document.querySelector('.nav').addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if(!b) return;
    tab = b.getAttribute('data-tab');
    if(tab!=='settings') unlocked = false;
    calOffset = 0; selDay = ''; editing = false;
    render(); window.scrollTo(0,0);
  });

  document.getElementById('view').addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if(act==='toggle') toggleTask(id);
    else if(act==='redeem') redeem(id);
    else if(act==='cal-prev'){ calOffset = Math.max(-24, calOffset-1); selDay=''; editing=false; render(); }
    else if(act==='cal-next'){ calOffset = Math.min(0, calOffset+1); selDay=''; editing=false; render(); }
    else if(act==='edit-day' || act==='edit-done' || act==='unlock-edit' || act==='toggle-past'){
      var ys = window.scrollY;
      if(act==='edit-day'){ editing = (S.pin && !unlocked) ? 'pin' : true; render(); }
      else if(act==='edit-done'){ editing = false; render(); }
      else if(act==='unlock-edit'){
        var pv = (document.getElementById('pin-in2')||{}).value||'';
        if(pv===S.pin){ unlocked = true; editing = true; render(); }
        else { document.getElementById('pin-err2').textContent = '暗証番号がちがいます'; return; }
      }
      else if(act==='toggle-past' && selDay){ toggleTask(id, selDay); }
      window.scrollTo(0, ys);
      if(editing==='pin'){ var pi=document.getElementById('pin-in2'); if(pi) pi.focus({preventScroll:true}); }
      else if(act==='toggle-past'){ var tb=document.querySelector('[data-act="toggle-past"][data-id="'+id+'"]'); if(tb) tb.focus({preventScroll:true}); }
    }
    else if(act==='pick-day'){
      var pk = b.getAttribute('data-k');
      editing = false;
      selDay = (selDay===pk) ? '' : pk;
      var y0 = window.scrollY; render(); window.scrollTo(0, y0);
      var nb = document.querySelector('[data-act="pick-day"][data-k="'+pk+'"]'); if(nb) nb.focus({preventScroll:true});
    }
    else if(act==='accent'){ S.accent = b.getAttribute('data-c'); save(); render(); toast('テーマカラーを「'+b.getAttribute('aria-label')+'」にしました'); }
    else if(act==='add-task'){
      S.tasks.push({id:uid(), title:'新しいタスク', when:'放課後', mins:10, pts:10}); save(); render();
      var ins = document.querySelectorAll('[data-task][data-f="title"]'); var last = ins[ins.length-1];
      if(last){ last.focus(); last.select(); }
    }
    else if(act==='del-task'){
      var t = S.tasks.filter(function(x){return x.id===id;})[0];
      modal({title:'「'+(t?t.title:'')+'」を削除する？', body:'これまでの記録のポイントはそのまま残ります。', ok:'削除する', danger:true,
        onOk:function(){ S.tasks = S.tasks.filter(function(x){return x.id!==id;}); save(); render(); toast('削除しました'); }});
    }
    else if(act==='add-rw'){
      S.rewards.push({id:uid(), title:'新しいごほうび', cost:100}); save(); render();
      var ri = document.querySelectorAll('[data-rw][data-f="title"]'); var lr = ri[ri.length-1];
      if(lr){ lr.focus(); lr.select(); }
    }
    else if(act==='del-rw'){
      var r = S.rewards.filter(function(x){return x.id===id;})[0];
      modal({title:'「'+(r?r.title:'')+'」を削除する？', ok:'削除する', danger:true,
        onOk:function(){ S.rewards = S.rewards.filter(function(x){return x.id!==id;}); save(); render(); toast('削除しました'); }});
    }
    else if(act==='adj'){
      var n = parseInt(b.getAttribute('data-n'),10);
      S.points = Math.max(0, S.points + n); save(); render();
    }
    else if(act==='unlock'){
      var v = (document.getElementById('pin-in')||{}).value||'';
      if(v===S.pin){ unlocked = true; render(); }
      else { document.getElementById('pin-err').textContent = '暗証番号がちがいます'; }
    }
    else if(act==='set-pin'){
      var p = (document.getElementById('f-pin')||{}).value||'';
      if(!/^[0-9]{4,8}$/.test(p)){ document.getElementById('setpin-err').textContent = '4〜8桁の数字で入れてください'; return; }
      S.pin = p; unlocked = true; save(); render(); toast('設定をロックしました');
    }
    else if(act==='clear-pin'){
      modal({title:'ロックを外す？', body:'暗証番号なしで設定を開けるようになります。', ok:'外す',
        onOk:function(){ S.pin=''; save(); render(); toast('ロックを外しました'); }});
    }
    else if(act==='reset'){
      modal({title:'すべてのデータを消す？', body:'タスク、ごほうび、ポイント、記録がすべて初期状態に戻ります。元に戻せません。', ok:'消す', danger:true,
        onOk:function(){ S = defaults(); unlocked = false; save(); tab='today'; render(); toast('最初の状態に戻しました'); }});
    }
  });

  document.getElementById('view').addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.id==='pin-in'){ var b=document.querySelector('[data-act="unlock"]'); if(b) b.click(); }
    if(e.key==='Enter' && e.target.id==='pin-in2'){ var b2=document.querySelector('[data-act="unlock-edit"]'); if(b2) b2.click(); }
  });

  document.getElementById('view').addEventListener('change', function(e){
    var el = e.target;
    var set = el.getAttribute('data-set');
    if(set==='name'){ S.name = el.value.trim().slice(0,20); save(); return; }
    if(set==='weeklyGoal'){ S.weeklyGoal = num(el.value, 300, 0, 100000); el.value = S.weeklyGoal; save(); return; }
    var tid = el.getAttribute('data-task'), rid = el.getAttribute('data-rw'), f = el.getAttribute('data-f');
    if(tid){
      var t = S.tasks.filter(function(x){return x.id===tid;})[0]; if(!t) return;
      if(f==='title') t.title = el.value.trim() || '名前のないタスク';
      else if(f==='when') t.when = el.value;
      else if(f==='mins') { t.mins = num(el.value,10,0,600); el.value=t.mins; }
      else if(f==='pts') { t.pts = num(el.value,10,0,10000); el.value=t.pts; }
      save();
    }
    if(rid){
      var r = S.rewards.filter(function(x){return x.id===rid;})[0]; if(!r) return;
      if(f==='title') r.title = el.value.trim() || '名前のないごほうび';
      else if(f==='cost') { r.cost = num(el.value,100,0,100000); el.value=r.cost; }
      save();
    }
  });

  function checkDay(){ if(todayKey()!==renderedDay && tab!=='settings') render(); }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkDay(); });
  setInterval(checkDay, 60000);

  save();
  render();
})();
</script>
</body>
</html>
